{{define "title"}}
<title>
  {{.Content.List.FullName}} settings &mdash; {{cfg "sr.ht" "site-name"}} lists
</title>
{{end}}

{{define "settings"}}
<div class="container">
  <form class="row" method="POST">
    <div class="col-md-6">
      {{.CSRF}}
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          name="name"
          id="name"
          class="form-control"
          value="{{.Content.List.Name}}"
          disabled />
      </div>
      <div class="form-group ">
        <label for="description">Description</label>
        <textarea
          name="description"
          id="description"
          class="form-control"
          placeholder="Markdown supported"
          rows="10"
          aria-describedby="description-help"
        >{{.Content.Description}}</textarea>
        
      </div>
      
      <span class="pull-right">
        <a
          href="/{{.Content.List.FullName}}"
          class="btn btn-default"
        >Cancel</a>
        <button type="submit" class="btn btn-primary">
          Save {{icon "caret-right"}}
        </button>
      </span>
    </div>
    <div class="col-md-6 d-flex flex-column">
      <fieldset class="form-group">
        <legend>Mailing List Visibility</legend>
        <div class="form-check">
          <label class="form-check-label">
            <input
              class="form-check-input"
              type="radio"
              name="visibility"
              value="PUBLIC"
              {{if eq .Content.List.Visibility "PUBLIC"}}
              checked
              {{end}}
              > Public
            <small id="visibility-public-help" class="form-text text-muted">
              Shown on your profile page
            </small>
          </label>
        </div>
        <div class="form-check">
          <label
              class="form-check-label"
              title="Visible to anyone with the link, but not shown on your profile"
            >
            <input
              class="form-check-input"
              type="radio"
              name="visibility"
              value="UNLISTED"
              {{if eq .Content.List.Visibility "UNLISTED"}}
              checked
              {{end}}
              > Unlisted
            <small id="visibility-unlisted-help" class="form-text text-muted">
              Visible to anyone who knows the URL, but not shown on your profile
            </small>
          </label>
        </div>
        <div class="form-check">
          <label
            class="form-check-label"
            title="Only visible to you and your collaborators"
          >
            <input
              class="form-check-input"
              type="radio"
              name="visibility"
              value="PRIVATE"
              {{if eq .Content.List.Visibility "PRIVATE"}}
              checked
              {{end}}
              > Private
            <small id="visibility-unlisted-help" class="form-text text-muted">
              Only visible to you and your collaborators
            </small>
          </label>
        </div>
      </fieldset>
    </div>
  </div>
</div>
{{end}}
