{{define "title"}}
<title>
  {{.Content.List.FullName}} settings &mdash; {{cfg "sr.ht" "site-name"}} lists
</title>
{{end}}

{{define "settings"}}
<div class="container">
  <div class="row">
    <div class="col-md-8">
      <form method="POST">
        {{.CSRF}}
        <div class="form-group">
          <label for="permitMime">
            Permitted mimetypes
          </label>
          <input
            type="text"
            name="permitMime"
            id="permitMime"
            class="form-control"
            value="{{.Content.PermitMime}}"
            aria-describedby="permitMime-help" />
          <p
            id="permitMime-help"
            class="form-text text-muted"
          >
            Comma separated list of mimetypes, <a
              href="https://pubs.opengroup.org/onlinepubs/009695399/utilities/xcu_chap02.html#tag_02_13_01"
              rel="noopener"
              target="_blank"
            >fnmatch</a> for wildcards.
          </p>
          
        </div>
        <div class="form-group">
          <label for="rejectMime">
            Rejected mimetypes
          </label>
          <input
            type="text"
            name="rejectMime"
            id="rejectMime"
            class="form-control"
            value="{{.Content.RejectMime}}"
            aria-describedby="rejectMime-help" />
          <p
            id="rejectMime-help"
            class="form-text text-muted"
          >
            Comma separated list of mimetypes, <a
              href="https://pubs.opengroup.org/onlinepubs/009695399/utilities/xcu_chap02.html#tag_02_13_01"
              rel="noopener"
              target="_blank"
            >fnmatch</a> for wildcards.
          </p>
          
        </div>
        
        <span class="pull-right">
          <button type="submit" class="btn btn-primary">
            Save {{icon "caret-right"}}
          </button>
        </span>
      </form>
    </div>
  </div>
</div>
{{end}}
