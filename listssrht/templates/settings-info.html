{% extends "settings.html" %}
{% block title %}
<title>
  {{ owner.canonical_name }}/{{ ml.name }} settings &mdash; {{ cfg("sr.ht", "site-name") }} lists
</title>
{% endblock %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-8">
      <form method="POST">
        {{csrf_token()}}
        <div class="form-group">
          <label for="name">
            Name
            <span class="text-muted">(you can't edit this)</p>
          </label>
          <input
            type="text"
            name="name"
            id="name"
            class="form-control"
            value="{{ ml.name }}"
            disabled />
        </div>
        <div class="form-group {{valid.cls("description")}}">
          <label for="description">Description</label>
          <textarea
            name="description"
            id="description"
            class="form-control"
            placeholder="Markdown supported"
            rows="10"
            aria-describedby="description-help"
          >{{description or ml.description or ""}}</textarea>
          {{ valid.summary("description") }}
        </div>
        {{ valid.summary() }}
        <span class="pull-right">
          <a
            href="{{ url_for("archives.archive",
              owner_name=ml.owner.canonical_name,
              list_name=ml.name) }}"
            class="btn btn-default"
          >Cancel</a>
          <button type="submit" class="btn btn-primary">
            Save {{icon("caret-right")}}
          </button>
        </span>
      </form>
    </div>
  </div>
</div>
{% endblock %}
